name: QX phase 7 project workflow validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  project-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js 22.16.0
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
      - name: Run QX core and project workflow tests
        working-directory: engine/qx-core
        run: npm test
      - name: Install temporary browser test dependency
        working-directory: engine/qx-core
        run: npm install --no-save playwright
      - name: Install Chromium
        working-directory: engine/qx-core
        run: npx playwright install --with-deps chromium
      - name: Run integrated phase 7 browser acceptance
        working-directory: engine/qx-core
        run: node scripts/phase7-project-browser-smoke.mjs
