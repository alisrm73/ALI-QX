name: QX phase 7 project workflow validation

on:
  pull_request:
    branches:
      - "main"
    paths:
      - "engine/qx-core/**"
      - "QX/spec/PHASE-7-*.md"
      - ".github/workflows/phase7-project-validation.yml"
  push:
    branches:
      - "main"
    paths:
      - "engine/qx-core/**"
      - "QX/spec/PHASE-7-*.md"
      - ".github/workflows/phase7-project-validation.yml"

permissions:
  contents: read

jobs:
  project-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js 22.16.0
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
      - name: Run QX core and project workflow tests
        working-directory: engine/qx-core
        run: npm test
