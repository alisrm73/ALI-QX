name: QX phase 4 VM validation

on:
  push:
    branches:
      - "feature/phase4-vm"
  pull_request:
    branches:
      - "main"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js 22.16.0
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"

      - name: Run QX core test suite
        working-directory: engine/qx-core
        run: npm test
