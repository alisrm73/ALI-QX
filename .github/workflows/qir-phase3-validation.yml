name: QX phase 3 QIR validation

on:
  push:
    branches:
      - "feature/phase3-qir"
  pull_request:
    branches:
      - "main"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qir:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js 22.16.0
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
      - name: Run QX core tests
        working-directory: engine/qx-core
        run: npm test
