name: QX verification and source archive

on:
  push:
    branches:
      - "feature/unicode-18-lexer"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"

      - name: Run QX core tests
        working-directory: engine/qx-core
        run: npm test

      - name: Package repository ZIP
        if: always()
        run: |
          zip -qr "$RUNNER_TEMP/ALI-QX-feature-unicode-18-lexer.zip" . -x ".git/*"

      - name: Upload source ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ALI-QX-feature-unicode-18-lexer
          path: ${{ runner.temp }}/ALI-QX-feature-unicode-18-lexer.zip
          if-no-files-found: error
          retention-days: 7
